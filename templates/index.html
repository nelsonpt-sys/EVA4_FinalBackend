{% extends "base/base.html" %}

{% block titulo %}
    Inicio: {{ user.username }}
{% endblock %}

{% block contenido %}
    <div class="mb-5">
        {% if user.is_authenticated %}
            <div class="alert alert-warning col-8 offset-md-2" role="alert">
                <h2 class="text-center">Bienvenido al Sistema de Reservas 😉: {{ user.username }}</h2>
            </div>    
        {% else %}
            <div class="alert alert-warning col-10 offset-md-1" role="alert">
                <h2 class="text-center">Bienvenido: Puedes Logearte en la pestaña de Admin 😁</h2>
            </div>
        {% endif %} 
    </div>
    
{% endblock %}
